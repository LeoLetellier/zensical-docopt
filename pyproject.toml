[project]
name = "zensical-docopt"
version = "0.1.0"
description = "Parse docopt docstrings and render them as documentation (Zensical / MkDocs)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Typing :: Typed",
]

[project.scripts]
zensical-docopt = "zensical_docopt.cli:main"

[project.entry-points."markdown.extensions"]
zensical_docopt = "zensical_docopt.markdown_ext:DocoptExtension"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zensical_docopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
files = ["src"]

[dependency-groups]
dev = [
    "markdown>=3.10.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
markdown = ["markdown>=3.5"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
extraPaths = ["src"]
